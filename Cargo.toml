[package]
name = "rs-pdf-render"
version = "0.2.1"
edition = "2024"
description = "An ultralightweight PDF reader"
license = "AGPL-3.0-or-later"

[dependencies]
# Defaults minus "thread-pool" (tokio runs tasks).
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "linux-theme-detection", "x11", "wayland", "tokio", "image-without-codecs", "canvas", "svg"] }
# MuPDF, built from source and linked in. Only its PDF support and the 14
# standard fonts.
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPrintOperation", "NSPrintInfo", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
objc2-pdf-kit = { version = "0.3", default-features = false, features = ["std", "PDFDocument", "objc2-app-kit"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Measured on Windows: "s" and "abort" each cut the executable by about a
# fifth (13.2 MB to 8.0 MB together) with no measurable change in CPU or
# memory. "abort" means an internal error closes the app instead of only
# stopping the PDF thread; both would be bugs either way.
[profile.release]
opt-level = "s"
panic = "abort"
lto = true
codegen-units = 1
strip = true
